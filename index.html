erenzpunkt bleiben."}, {"q": "Ist Umdrehungszähler-Update eine vollständige Präzisionskalibrierung?", "a": ["Nein", "Ja immer", "Nur bei PROFINET"], "e": "Feinkalibrierung und Umdrehungszähler sind zu unterscheiden; Produkthandbuch beachten."}, {"q": "Was enthält tooldata?", "a": ["Werkzeugpose und Lastdaten sowie robhold", "Nur XYZ", "Nur Werkzeugname"], "e": "Falsche Lastdaten beeinflussen Dynamik und Regelung."}, {"q": "Was enthält wobjdata?", "a": ["Bezugssysteme und Angaben zum Halten beziehungsweise mechanischer Einheit", "Nur Geschwindigkeit", "Nur Roboterachsen"], "e": "User Frame und Object Frame strukturieren den Bezug."}]}, {"title": "RobotStudio", "q": [{"q": "Was ist ein Virtual Controller?", "a": ["Virtuelle Ausführung eines RobotWare-Systems", "Nur ein 3D-Modell", "Eine SPS"], "e": "Er ermöglicht RAPID-Ausführung und controllernahe Tests."}, {"q": "Was bewirkt Synchronisieren zu RAPID?", "a": ["Überträgt geeignete Stationsdaten zur RAPID-Seite", "Löscht automatisch alle Targets", "Kalibriert reale Mechanik"], "e": "3D-Stationsdaten und Controllerdaten sind getrennte Repräsentationen."}, {"q": "Wofür dient Pack & Go?", "a": ["Transport einer Station mit zugehörigen Ressourcen", "Not-Halt-Reset", "Motorwechsel"], "e": "Das Paket erleichtert die Weitergabe eines Projekts."}, {"q": "Was unterscheidet Smart Components von RAPID?", "a": ["Sie modellieren unter anderem Stationslogik und simulierte Peripherie", "Sie ersetzen immer die reale SPS", "Sie sind Sicherheits-SPS"], "e": "Smart Components bilden beispielsweise Greifer und Sensoren ab."}, {"q": "Was prüft Collision Detection?", "a": ["Geometrische Kollisionen konfigurierter Objekte", "Garantierte reale Personensicherheit", "SPS-Quellcode"], "e": "Das Ergebnis hängt von Geometrie, Einstellungen und Modelltreue ab."}, {"q": "Was brauchst du für realitätsnahe Offline-Programmierung?", "a": ["Passende RobotWare, Geometrie, Frames und Kalibrierdaten", "Nur CAD", "Nur IP-Adresse"], "e": "Eine Simulation mus us"], "e": "TRAP-Routinen reagieren auf konfigurierte Interrupt-Ereignisse."}, {"q": "Was verbindet CONNECT?", "a": ["Interruptidentität mit TRAP-Routine", "Roboter mit Ethernet", "Werkzeug mit Flansch"], "e": "Ein Ereignis muss anschließend über passende Instruktionen eingerichtet werden."}, {"q": "Wofür dient ISignalDI?", "a": ["Einrichten eines Interrupts auf ein digitales Eingangssignal", "Setzen eines Ausgangs", "Kalibrieren eines Eingangs"], "e": "Die Signalbedingung löst den eingerichteten Interrupt aus."}, {"q": "Was ist bei mehreren Tasks mit gemeinsamen Daten wichtig?", "a": ["Synchronisation und definierte Schreibverantwortung", "Beliebige parallele Änderungen", "Nur gleicher Variablenname"], "e": "Race Conditions können sonst inkonsistente Zustände erzeugen."}, {"q": "Was ist ein Vorteil von Hintergrundtasks?", "a": ["Prozessüberwachung parallel zum Bewegungsablauf", "Automatische Safety-Zertifizierung", "Unbegrenzte Bewegungskontrolle"], "e": "Tasktyp, RobotWare-Optionen und Zugriffsregeln beachten."}]}, {"title": "Fehlerbehandlung und Recovery", "q": [{"q": "Was ist ERROR in einer RAPID-Routine?", "a": ["Ein Abschnitt zur Fehlerbehandlung", "Ein Datentyp", "Ein Systemeingang"], "e": "Der Handler kann Laufzeitfehler abhängig vom Fehlerkontext behandeln."}, {"q": "Was bewirkt RETRY im geeigneten Fehlerhandler?", "a": ["Erneute Ausführung der fehlerauslösenden Instruktion", "Überspringen der Instruktion", "Neustart des Controllers"], "e": "Wiederholungen müssen begrenzt und prozesssicher sein."}, {"q": "Was bewirkt TRYNEXT?", "a": ["Fortsetzen mit der nächsten Instruktion im geeigneten Kontext", "Wiederholen der fehlerhaften Instruktion", "Löschen des Moduls"], "e": "Nur einsetzen, wenn Überspringen den Prozesszustand nicht gefährdet."}, {"q": "Was enthält ERRNO?", "a": ["Nummer des behandelten Fehlers", "Roboterseriennummer", "Anzahl der Achsen"], "e": "ERRNO hilft bei differenzierter Fehlerbehandlung."}, {"q": "Greiferstatus nach Stromausfall unbekannt:
